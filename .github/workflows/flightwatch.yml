# FlightWatch：每 2 小时自动查一次机票价格，降价时推送到手机，并更新网页看板。
# 两个密钥在仓库的 Settings → Secrets and variables → Actions 里设置：
#   SERPAPI_KEY  SerpApi 的 API key
#   NTFY_TOPIC   手机 ntfy App 里订阅的主题名
# 改完下面的设置后提交即可，下次运行自动生效。

name: FlightWatch

on:
  schedule:
    - cron: "17 */2 * * *"     # 每 2 小时一次（UTC 时间，每次在第 17 分钟左右开始）
  workflow_dispatch:            # 允许在 Actions 页面手动点 "Run workflow"

permissions:
  contents: write               # 把价格记录保存回仓库
  pages: write                  # 发布看板网页
  id-token: write

concurrency:
  group: flightwatch
  cancel-in-progress: false

env:
  # ---- 行程 ----
  ORIGINS: "LHR"                # 出发机场，多个用逗号，如 "LHR,LGW"
  DESTS: "PVG,SHA"              # 上海浦东 + 虹桥
  RET_ORIGINS: "HRB"            # 回程从哈尔滨出发；和 DESTS 一样时才会查往返票
  OUT_START: "2026-12-11"       # 去程最早
  OUT_END: "2026-12-16"         # 去程最晚
  RET_START: "2026-12-27"       # 回程最早
  RET_END: "2026-12-30"         # 回程最晚
  MAX_HOURS: "17"               # 去程（含转机）最长小时数
  RET_MAX_HOURS: "24"           # 回程（含转机）最长小时数
  CLASSES: "business,premium"   # 商务舱 + 超级经济舱；只要商务舱就改成 "business"
  PRIMARY_CLASS: "business"     # 优先显示和提醒的舱位
  LONG_SEGMENT_HOURS: "5"       # 超过 5 小时的航段必须是上面的舱位；短的国内转机段可以是经济舱
  ROUND_TRIP: "true"            # 同时比较往返票（回程从别的城市出发时自动关闭）
  # ---- 提醒 ----
  CURRENCY: "GBP"
  TARGET_PRICE: "0"             # 商务舱目标总价，低于它会发高优先级提醒；0 = 不设
  ALERT_MIN_DROP: "20"          # 最低价至少降多少才提醒（£）
  DIGEST_HOUR_UTC: "8"          # 每天 8 点后的第一次运行发一条当日汇总；-1 = 关闭
  # ---- 额度和运行 ----
  RESERVE_SEARCHES: "10"        # 留几次额度不用
  STOP_DATE: "2026-12-16"       # 这天之后停止查询
  RUN_INTERVAL_HOURS: "2"       # 要和上面 cron 的间隔一致
  MAX_PER_RUN: "8"              # 每次运行最多查几个
  DATA_DIR: "data"              # 价格记录保存在仓库的 data 文件夹
  OUTPUT_DIR: "site"            # 看板网页生成到这里再发布

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 查价格
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python app.py --once

      - name: 保存价格记录
        run: |
          git config user.name "flightwatch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "没有新记录"
          else
            git commit -m "价格记录 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
